name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Migrations embutidas estão em dia
        run: |
          npm run db:bundle
          git diff --exit-code src/db/migrations.generated.ts \
            || (echo "::error::src/db/migrations.generated.ts está desatualizado. Rode 'npm run db:bundle' e commite." && exit 1)

      - name: Build (mesma configuração do Webflow Cloud)
        run: npm run build
        env:
          # o Webflow Cloud injeta BASE_URL a partir do mount path
          BASE_URL: /app
          AUTH_SECRET: ci-placeholder-secret-para-build
