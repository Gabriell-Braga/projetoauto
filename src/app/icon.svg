<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ProjetoAuto">
  <!--
    Marca na identidade C4MP: roxo de ação como fundo, glifo branco.

    O tacômetro âmbar anterior era a assinatura do sistema antigo. Aqui a forma
    é um carro reduzido ao essencial — quatro elementos sólidos, sem traço fino,
    porque a favicon é lida a 16px e linha de 1px vira cinza sujo nesse tamanho.

    Raio generoso no ladrilho para conversar com as superfícies do sistema.
  -->
  <rect width="32" height="32" rx="9" fill="#694AE5" />
  <rect x="10.5" y="9.5" width="11" height="6.5" rx="2.4" fill="#FFFFFF" />
  <rect x="5" y="14" width="22" height="7" rx="3" fill="#FFFFFF" />
  <circle cx="10.5" cy="22" r="2.6" fill="#FFFFFF" />
  <circle cx="21.5" cy="22" r="2.6" fill="#FFFFFF" />
</svg>
